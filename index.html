<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>VR Stereo Fisheye Camera Viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 10;
      background: rgba(0, 0, 0, 0.85);
      padding: 12px;
      border-radius: 8px;
      max-width: 300px;
      display: block;
    }
    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
      width: 100%;
    }
    .control-group {
      margin-top: 8px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
    }
    input[type="range"] {
      width: 100%;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

<div id="ui">
  <button id="start-btn">カメラ & VRモード起動 (全画面)</button>
  <p id="status">ボタンを押してカメラとセンサーを許可してください。端末を横向きにしてご使用ください。</p>
  
  <div class="control-group">
    <label for="ipd-range">目の間隔調整 (IPD): <span id="ipd-val">0.064</span></label>
    <input type="range" id="ipd-range" min="0.03" max="0.10" step="0.002" value="0.064">
  </div>
</div>

<video id="webcam" autoplay playsinline style="display:none;"></video>

<script type="module">
  import * as THREE from 'three';

  let scene, cameraLeft, cameraRight, renderer, video, videoTexture;
  let eyeSep = 0.064; 

  const startBtn = document.getElementById('start-btn');
  const ui = document.getElementById('ui');
  const status = document.getElementById('status');
  const ipdRange = document.getElementById('ipd-range');
  const ipdVal = document.getElementById('ipd-val');
  video = document.getElementById('webcam');

  ipdRange.addEventListener('input', (e) => {
    eyeSep = parseFloat(e.target.value);
    ipdVal.textContent = eyeSep.toFixed(3);
    updateCameraPositions();
  });

  startBtn.addEventListener('click', async () => {
    // 1. ブラウザを全画面（フルスクリーン）に切り替えてアドレスバーを隠す
    requestFullScreenMode();

    // 2. UI要素（ボタンやURLバー周りの要素）を非表示にする
    ui.style.display = 'none';

    try {
      // センサーアクセスの許可（iOS等の対応）
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        await DeviceOrientationEvent.requestPermission();
      }

      // 背面カメラの起動
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      initThreeJS();
      setupDeviceOrientation();
    } catch (err) {
      ui.style.display = 'block';
      status.textContent = "起動に失敗しました: " + err.message;
    }
  });

  // 全画面表示APIの呼び出し処理
  function requestFullScreenMode() {
    const docEl = document.documentElement;
    if (docEl.requestFullscreen) {
      docEl.requestFullscreen().catch(() => {});
    } else if (docEl.webkitRequestFullscreen) { /* iOS / Safari 用 */
      docEl.webkitRequestFullscreen().catch(() => {});
    } else if (docEl.msRequestFullscreen) {
      docEl.msRequestFullscreen().catch(() => {});
    }
  }

  function initThreeJS() {
    scene = new THREE.Scene();

    const aspect = (window.innerWidth / 2) / window.innerHeight;
    cameraLeft = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
    cameraRight = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
    
    updateCameraPositions();

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.autoClear = false;
    document.body.appendChild(renderer.domElement);

    videoTexture = new THREE.VideoTexture(video);
    videoTexture.colorSpace = THREE.SRGBColorSpace;

    // 映像90度回転 ＋ 魚眼レンズ変換シェーダー
    const fisheyeShaderMaterial = new THREE.ShaderMaterial({
      uniforms: {
        map: { value: videoTexture },
        strength: { value: 1.2 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D map;
        uniform float strength;
        varying vec2 vUv;

        // UV座標を90度回転
        vec2 rotate90(vec2 uv) {
            return vec2(uv.y, 1.0 - uv.x);
        }

        void main() {
          vec2 rotatedUv = rotate90(vUv);
          vec2 p = rotatedUv * 2.0 - 1.0;
          float r = length(p);

          if (r < 1.0) {
            float theta = atan(p.y, p.x);
            float radius = pow(r, strength);
            vec2 finalUv;
            finalUv.x = radius * cos(theta);
            finalUv.y = radius * sin(theta);
            
            finalUv = (finalUv + 1.0) * 0.5;
            gl_FragColor = texture2D(map, finalUv);
          } else {
            gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
          }
        }
      `,
      side: THREE.BackSide
    });

    const geometry = new THREE.SphereGeometry(10, 64, 64);
    const sphere = new THREE.Mesh(geometry, fisheyeShaderMaterial);
    scene.add(sphere);

    animate();
    window.addEventListener('resize', onWindowResize);
  }

  function updateCameraPositions() {
    if (cameraLeft && cameraRight) {
      cameraLeft.position.set(-eyeSep / 2, 0, 0);
      cameraRight.position.set(eyeSep / 2, 0, 0);
    }
  }

  function setupDeviceOrientation() {
    window.addEventListener('deviceorientation', (event) => {
      if (!event.alpha) return;

      const alpha = THREE.MathUtils.degToRad(event.alpha || 0);
      const beta = THREE.MathUtils.degToRad(event.beta || 0);
      const gamma = THREE.MathUtils.degToRad(event.gamma || 0);

      const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
      
      if (cameraLeft && cameraRight) {
        cameraLeft.quaternion.setFromEuler(euler);
        cameraRight.quaternion.setFromEuler(euler);
      }
    });
  }

  function animate() {
    requestAnimationFrame(animate);

    if (!scene) return;

    const width = window.innerWidth;
    const height = window.innerHeight;

    renderer.clear();

    // 左目用描画
    renderer.setViewport(0, 0, width / 2, height);
    renderer.setScissor(0, 0, width / 2, height);
    renderer.setScissorTest(true);
    renderer.render(scene, cameraLeft);

    // 右目用描画
    renderer.setViewport(width / 2, 0, width / 2, height);
    renderer.setScissor(width / 2, 0, width / 2, height);
    renderer.setScissorTest(true);
    renderer.render(scene, cameraRight);
  }

  function onWindowResize() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const aspect = (width / 2) / height;

    if (cameraLeft && cameraRight) {
      cameraLeft.aspect = aspect;
      cameraLeft.updateProjectionMatrix();

      cameraRight.aspect = aspect;
      cameraRight.updateProjectionMatrix();
    }

    renderer.setSize(width, height);
  }
</script>

</body>
</html>
