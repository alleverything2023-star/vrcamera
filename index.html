<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Stereo Fisheye Camera</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 10;
      background: rgba(0, 0, 0, 0.8);
      padding: 12px;
      border-radius: 8px;
      max-width: 300px;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .control-group {
      margin-top: 8px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
    }
    input[type="range"] {
      width: 100%;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

<div id="ui">
  <button id="start-btn">カメラ & VRモード起動</button>
  <p id="status">ボタンを押してカメラとセンサーを許可してください。</p>
  
  <div class="control-group">
    <label for="ipd-range">目の間隔調整 (IPD): <span id="ipd-val">0.064</span></label>
    <input type="range" id="ipd-range" min="0.03" max="0.10" step="0.002" value="0.064">
  </div>
</div>

<video id="webcam" autoplay playsinline style="display:none;"></video>

<script type="module">
  import * as THREE from 'three';

  let scene, cameraLeft, cameraRight, renderer, video, videoTexture;
  let eyeSep = 0.064; // 既定の瞳孔間距離 (6.4cm)

  const startBtn = document.getElementById('start-btn');
  const status = document.getElementById('status');
  const ipdRange = document.getElementById('ipd-range');
  const ipdVal = document.getElementById('ipd-val');
  video = document.getElementById('webcam');

  // 目の間隔のスライダー調整
  ipdRange.addEventListener('input', (e) => {
    eyeSep = parseFloat(e.target.value);
    ipdVal.textContent = eyeSep.toFixed(3);
    updateCameraPositions();
  });

  startBtn.addEventListener('click', async () => {
    try {
      // iOSなどのジャイロセンサー許可要求
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        await DeviceOrientationEvent.requestPermission();
      }

      // カメラ起動
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      document.getElementById('ui').style.opacity = '0.3'; // 操作パネルを半透明化
      status.textContent = "動作中 (ゴーグルにセットしてください)";

      initThreeJS();
      setupDeviceOrientation();
    } catch (err) {
      status.textContent = "起動に失敗しました: " + err.message;
    }
  });

  function initThreeJS() {
    scene = new THREE.Scene();

    // 左右2つのカメラを作成
    const aspect = (window.innerWidth / 2) / window.innerHeight;
    cameraLeft = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
    cameraRight = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
    
    updateCameraPositions();

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.autoClear = false; // 左右描画のため自動クリアをオフ
    document.body.appendChild(renderer.domElement);

    videoTexture = new THREE.VideoTexture(video);
    videoTexture.colorSpace = THREE.SRGBColorSpace;

    // 魚眼シェーダーマテリアル
    const fisheyeShaderMaterial = new THREE.ShaderMaterial({
      uniforms: {
        map: { value: videoTexture },
        strength: { value: 1.2 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D map;
        uniform float strength;
        varying vec2 vUv;

        void main() {
          vec2 p = vUv * 2.0 - 1.0;
          float r = length(p);

          if (r < 1.0) {
            float theta = atan(p.y, p.x);
            float radius = pow(r, strength);
            vec2 uv;
            uv.x = radius * cos(theta);
            uv.y = radius * sin(theta);
            uv = (uv + 1.0) * 0.5;
            gl_FragColor = texture2D(map, uv);
          } else {
            gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
          }
        }
      `,
      side: THREE.BackSide
    });

    const geometry = new THREE.SphereGeometry(10, 64, 64);
    const sphere = new THREE.Mesh(geometry, fisheyeShaderMaterial);
    scene.add(sphere);

    animate();
    window.addEventListener('resize', onWindowResize);
  }

  // 瞳孔間距離（IPD）に基づいて左右カメラの位置を更新
  function updateCameraPositions() {
    if (cameraLeft && cameraRight) {
      cameraLeft.position.set(-eyeSep / 2, 0, 0);
      cameraRight.position.set(eyeSep / 2, 0, 0);
    }
  }

  // スマホの傾きに合わせてカメラを回転させる処理
  function setupDeviceOrientation() {
    window.addEventListener('deviceorientation', (event) => {
      if (!event.alpha) return;

      const alpha = THREE.MathUtils.degToRad(event.alpha || 0);
      const beta = THREE.MathUtils.degToRad(event.beta || 0);
      const gamma = THREE.MathUtils.degToRad(event.gamma || 0);

      const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
      
      // 左右両方のカメラの向きを揃える
      cameraLeft.quaternion.setFromEuler(euler);
      cameraRight.quaternion.setFromEuler(euler);
    });
  }

  function animate() {
    requestAnimationFrame(animate);

    const width = window.innerWidth;
    const height = window.innerHeight;

    renderer.clear();

    // 1. 左目用レンダリング（画面の左半分）
    renderer.setViewport(0, 0, width / 2, height);
    renderer.setScissor(0, 0, width / 2, height);
    renderer.setScissorTest(true);
    renderer.render(scene, cameraLeft);

    // 2. 右目用レンダリング（画面の右半分）
    renderer.setViewport(width / 2, 0, width / 2, height);
    renderer.setScissor(width / 2, 0, width / 2, height);
    renderer.setScissorTest(true);
    renderer.render(scene, cameraRight);
  }

  function onWindowResize() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const aspect = (width / 2) / height;

    cameraLeft.aspect = aspect;
    cameraLeft.updateProjectionMatrix();

    cameraRight.aspect = aspect;
    cameraRight.updateProjectionMatrix();

    renderer.setSize(width, height);
  }
</script>

</body>
</html>
