<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>YouTube VR Style Camera Viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 10;
      background: rgba(0, 0, 0, 0.85);
      padding: 12px;
      border-radius: 8px;
      max-width: 300px;
      display: block;
    }
    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
      width: 100%;
    }
    .control-group {
      margin-top: 8px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
    }
    input[type="range"] {
      width: 100%;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

<div id="ui">
  <button id="start-btn">カメラ & YouTube VRモード起動</button>
  <p id="status">ボタンを押してカメラとセンサーを許可してください。端末を横向きにしてご使用ください。</p>
  
  <div class="control-group">
    <label for="ipd-range">目の間隔調整 (IPD): <span id="ipd-val">0.064</span></label>
    <input type="range" id="ipd-range" min="0.03" max="0.10" step="0.002" value="0.064">
  </div>
</div>

<video id="webcam" autoplay playsinline style="display:none;"></video>

<script type="module">
  import * as THREE from 'three';

  let scene, cameraLeft, cameraRight, renderer, video, videoTexture;
  let eyeSep = 0.064; 

  const startBtn = document.getElementById('start-btn');
  const ui = document.getElementById('ui');
  const status = document.getElementById('status');
  const ipdRange = document.getElementById('ipd-range');
  const ipdVal = document.getElementById('ipd-val');
  video = document.getElementById('webcam');

  ipdRange.addEventListener('input', (e) => {
    eyeSep = parseFloat(e.target.value);
    ipdVal.textContent = eyeSep.toFixed(3);
    updateCameraPositions();
  });

  startBtn.addEventListener('click', async () => {
    requestFullScreenMode();
    ui.style.display = 'none';

    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        await DeviceOrientationEvent.requestPermission();
      }

      // 最広角（最小ズーム）カメラの呼び出し
      const constraints = {
        video: {
          facingMode: { ideal: "environment" },
          zoom: { ideal: 0 }
        },
        audio: false
      };

      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      await video.play();

      const track = stream.getVideoTracks()[0];
      if (track && track.getCapabilities) {
        const capabilities = track.getCapabilities();
        if (capabilities.zoom) {
          try {
            await track.applyConstraints({ advanced: [{ zoom: capabilities.zoom.min }] });
          } catch (e) {}
        }
      }

      initThreeJS();
      setupDeviceOrientation();
    } catch (err) {
      ui.style.display = 'block';
      status.textContent = "起動に失敗しました: " + err.message;
    }
  });

  function requestFullScreenMode() {
    const docEl = document.documentElement;
    if (docEl.requestFullscreen) {
      docEl.requestFullscreen().catch(() => {});
    } else if (docEl.webkitRequestFullscreen) {
      docEl.webkitRequestFullscreen().catch(() => {});
    } else if (docEl.msRequestFullscreen) {
      docEl.msRequestFullscreen().catch(() => {});
    }
  }

  function initThreeJS() {
    scene = new THREE.Scene();

    // 表示領域を小さくするためのアスペクト比計算 (正方形に近いアスペクト)
    const aspect = 1.0; 
    cameraLeft = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
    cameraRight = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
    
    updateCameraPositions();

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.autoClear = false;
    document.body.appendChild(renderer.domElement);

    videoTexture = new THREE.VideoTexture(video);
    videoTexture.colorSpace = THREE.SRGBColorSpace;

    // YouTube VR風のレンズ歪みシェーダー（手書き画像通りの正方形カットアウト & 270度回転）
    const fisheyeShaderMaterial = new THREE.ShaderMaterial({
      uniforms: {
        map: { value: videoTexture },
        k: { value: 0.18 } // YouTube VR標準に近い樽型歪み補正係数
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D map;
        uniform float k;
        varying vec2 vUv;

        // 向き合わせ用の270度回転
        vec2 rotate270(vec2 uv) {
            return vec2(1.0 - uv.y, uv.x);
        }

        void main() {
          vec2 rotatedUv = rotate270(vUv);
          vec2 p = rotatedUv * 2.0 - 1.0;
          float r2 = p.x * p.x + p.y * p.y;

          // YouTube VR風の樽型レンズ歪み処理
          vec2 distortion = p * (1.0 + k * r2);
          vec2 finalUv = (distortion + 1.0) * 0.5;

          // 範囲外を黒く塗りつぶし（正方形の枠）
          if (finalUv.x >= 0.0 && finalUv.x <= 1.0 && finalUv.y >= 0.0 && finalUv.y <= 1.0) {
            gl_FragColor = texture2D(map, finalUv);
          } else {
            gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
          }
        }
      `,
      side: THREE.BackSide
    });

    const geometry = new THREE.SphereGeometry(10, 64, 64);
    const sphere = new THREE.Mesh(geometry, fisheyeShaderMaterial);
    scene.add(sphere);

    animate();
    window.addEventListener('resize', onWindowResize);
  }

  function updateCameraPositions() {
    if (cameraLeft && cameraRight) {
      cameraLeft.position.set(-eyeSep / 2, 0, 0);
      cameraRight.position.set(eyeSep / 2, 0, 0);
    }
  }

  function setupDeviceOrientation() {
    window.addEventListener('deviceorientation', (event) => {
      if (!event.alpha) return;

      const alpha = THREE.MathUtils.degToRad(event.alpha || 0);
      const beta = THREE.MathUtils.degToRad(event.beta || 0);
      const gamma = THREE.MathUtils.degToRad(event.gamma || 0);

      const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
      
      if (cameraLeft && cameraRight) {
        cameraLeft.quaternion.setFromEuler(euler);
        cameraRight.quaternion.setFromEuler(euler);
      }
    });
  }

  function animate() {
    requestAnimationFrame(animate);

    if (!scene) return;

    const width = window.innerWidth;
    const height = window.innerHeight;

    renderer.clear();

    // --- 画像のイラスト通りのビューポート配置設定 ---
    // 画面左右それぞれの枠幅（半分の幅）
    const halfWidth = width / 2;
    
    // 表示サイズ（左右それぞれの画面中央に約70%のサイズで配置）
    const viewSize = Math.min(halfWidth, height) * 0.70;

    // 左目の表示位置 (左半分の中央)
    const leftX = (halfWidth - viewSize) / 2;
    const leftY = (height - viewSize) / 2;

    // 右目の表示位置 (右半分の中央)
    const rightX = halfWidth + (halfWidth - viewSize) / 2;
    const rightY = (height - viewSize) / 2;

    // 1. 左目の描画
    renderer.setViewport(leftX, leftY, viewSize, viewSize);
    renderer.setScissor(leftX, leftY, viewSize, viewSize);
    renderer.setScissorTest(true);
    renderer.render(scene, cameraLeft);

    // 2. 右目の描画
    renderer.setViewport(rightX, rightY, viewSize, viewSize);
    renderer.setScissor(rightX, rightY, viewSize, viewSize);
    renderer.setScissorTest(true);
    renderer.render(scene, cameraRight);
  }

  function onWindowResize() {
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
</script>

</body>
</html>
