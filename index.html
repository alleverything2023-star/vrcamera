<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>YouTube VR180 Fisheye Camera Viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 10;
      background: rgba(0, 0, 0, 0.85);
      padding: 12px;
      border-radius: 8px;
      max-width: 300px;
      display: block;
    }
    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
      width: 100%;
    }
    .control-group {
      margin-top: 8px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
    }
    input[type="range"] {
      width: 100%;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

<div id="ui">
  <button id="start-btn">カメラ起動</button>
  <p id="status">ボタンを押してカメラを許可してください。端末を横向きにしてご使用ください。</p>
  
  <div class="control-group">
    <label for="ipd-range">目の間隔調整 (IPD): <span id="ipd-val">0.064</span></label>
    <input type="range" id="ipd-range" min="0.03" max="0.10" step="0.002" value="0.064">
  </div>
</div>

<video id="webcam" autoplay playsinline style="display:none;"></video>

<script type="module">
  import * as THREE from 'three';

  let scene, cameraLeft, cameraRight, renderer, video, videoTexture;
  let eyeSep = 0.064; 

  const startBtn = document.getElementById('start-btn');
  const ui = document.getElementById('ui');
  const status = document.getElementById('status');
  const ipdRange = document.getElementById('ipd-range');
  const ipdVal = document.getElementById('ipd-val');
  video = document.getElementById('webcam');

  ipdRange.addEventListener('input', (e) => {
    eyeSep = parseFloat(e.target.value);
    ipdVal.textContent = eyeSep.toFixed(3);
    updateCameraPositions();
  });

  startBtn.addEventListener('click', async () => {
    requestFullScreenMode();
    ui.style.display = 'none';

    try {
      // 超広角レンズ（0.5x等）を優先的に選択してズームを解除するパラメータ設定
      const constraints = {
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          zoom: { ideal: 0.5 } 
        },
        audio: false
      };

      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      await video.play();

      // カメラがサポートしている場合は最小倍率（広角側）に完全固定
      const track = stream.getVideoTracks()[0];
      if (track && track.getCapabilities) {
        const capabilities = track.getCapabilities();
        if (capabilities.zoom) {
          try {
            await track.applyConstraints({ advanced: [{ zoom: capabilities.zoom.min }] });
          } catch (e) {}
        }
      }

      initThreeJS();
    } catch (err) {
      ui.style.display = 'block';
      status.textContent = "起動に失敗しました: " + err.message;
    }
  });

  function requestFullScreenMode() {
    const docEl = document.documentElement;
    if (docEl.requestFullscreen) {
      docEl.requestFullscreen().catch(() => {});
    } else if (docEl.webkitRequestFullscreen) {
      docEl.webkitRequestFullscreen().catch(() => {});
    } else if (docEl.msRequestFullscreen) {
      docEl.msRequestFullscreen().catch(() => {});
    }
  }

  function initThreeJS() {
    scene = new THREE.Scene();

    // 視野角(FOV)を120度の超超広角にして「望遠鏡（ズーム）感」を撤去
    const aspect = (window.innerWidth / 2) / window.innerHeight;
    cameraLeft = new THREE.PerspectiveCamera(120, aspect, 0.01, 100);
    cameraRight = new THREE.PerspectiveCamera(120, aspect, 0.01, 100);
    
    updateCameraPositions();

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.autoClear = false;
    document.body.appendChild(renderer.domElement);

    videoTexture = new THREE.VideoTexture(video);
    videoTexture.colorSpace = THREE.SRGBColorSpace;

    // VR180 Creator / Insta360等と同等仕様の 180° Equisolid 魚眼シェーダー
    const vr180FisheyeMaterial = new THREE.ShaderMaterial({
      uniforms: {
        map: { value: videoTexture }
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D map;
        varying vec3 vWorldPosition;

        #define PI 3.14159265359

        void main() {
          vec3 dir = normalize(vWorldPosition);

          // 球体座標から魚眼角度 theta / phi を算出
          float theta = atan(dir.x, -dir.z); // 水平角
          float phi = asin(dir.y);          // 垂直角

          // 180度魚眼マッピング（Equisolid / Equidistant 式展開）
          float r = 2.0 * sin(acos(-dir.z) / 2.0); 
          float angle = atan(dir.y, dir.x);

          vec2 uv;
          uv.x = (r * cos(angle)) * 0.5 + 0.5;
          
          // ★上下反転の修正（1.0 - にすることで正しい正位置へ）
          uv.y = 1.0 - ((r * sin(angle)) * 0.5 + 0.5);

          // 180度範囲外は黒としてマスク
          if (dir.z < 0.0 && uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0) {
            gl_FragColor = texture2D(map, uv);
          } else {
            gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
          }
        }
      `,
      side: THREE.BackSide
    });

    // 180度ドーム型の3D全天球ドームメッシュを作成
    const geometry = new THREE.SphereGeometry(10, 64, 64, 0, Math.PI * 2, 0, Math.PI);
    const sphere = new THREE.Mesh(geometry, vr180FisheyeMaterial);
    scene.add(sphere);

    animate();
    window.addEventListener('resize', onWindowResize);
  }

  function updateCameraPositions() {
    if (cameraLeft && cameraRight) {
      // カメラ位置を少し前方に押し出すことで望遠感を無くし視野を完全確保
      cameraLeft.position.set(-eyeSep / 2, 0, 0.1);
      cameraRight.position.set(eyeSep / 2, 0, 0.1);
      
      cameraLeft.lookAt(0, 0, -10);
      cameraRight.lookAt(0, 0, -10);
    }
  }

  function animate() {
    requestAnimationFrame(animate);

    if (!scene) return;

    const width = window.innerWidth;
    const height = window.innerHeight;

    renderer.clear();

    const halfWidth = width / 2;

    // 左目表示
    renderer.setViewport(0, 0, halfWidth, height);
    renderer.setScissor(0, 0, halfWidth, height);
    renderer.setScissorTest(true);
    renderer.render(scene, cameraLeft);

    // 右目表示
    renderer.setViewport(halfWidth, 0, halfWidth, height);
    renderer.setScissor(halfWidth, 0, halfWidth, height);
    renderer.setScissorTest(true);
    renderer.render(scene, cameraRight);
  }

  function onWindowResize() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const aspect = (width / 2) / height;

    if (cameraLeft && cameraRight) {
      cameraLeft.aspect = aspect;
      cameraLeft.updateProjectionMatrix();

      cameraRight.aspect = aspect;
      cameraRight.updateProjectionMatrix();
    }

    renderer.setSize(width, height);
  }
</script>

</body>
</html>
