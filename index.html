<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Fisheye Camera Viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 8px;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

<div id="info">
  <button id="start-btn">カメラを起動</button>
  <p id="status">ボタンを押してカメラを許可してください。</p>
</div>

<video id="webcam" autoplay playsinline style="display:none;"></video>

<script type="module">
  import * as THREE from 'three';
  import { VRButton } from 'three/addons/webxr/VRButton.js';

  let scene, camera, renderer, video, videoTexture;

  const startBtn = document.getElementById('start-btn');
  const status = document.getElementById('status');
  video = document.getElementById('webcam');

  startBtn.addEventListener('click', async () => {
    try {
      // 背面カメラの取得を試行、失敗した場合は標準カメラを取得
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      status.textContent = "カメラ接続完了。VRボタンを押して開始してください。";
      startBtn.style.display = 'none';

      initThreeJS();
    } catch (err) {
      status.textContent = "カメラのアクセスに失敗しました: " + err.message;
    }
  });

  function initThreeJS() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // モジュールからインポートしたVRButtonを生成
    document.body.appendChild(VRButton.createButton(renderer));

    videoTexture = new THREE.VideoTexture(video);
    videoTexture.colorSpace = THREE.SRGBColorSpace;

    // 魚眼変換シェーダー
    const fisheyeShaderMaterial = new THREE.ShaderMaterial({
      uniforms: {
        map: { value: videoTexture },
        strength: { value: 1.2 } // 魚眼の歪み具合
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D map;
        uniform float strength;
        varying vec2 vUv;

        void main() {
          vec2 p = vUv * 2.0 - 1.0;
          float r = length(p);

          if (r < 1.0) {
            float theta = atan(p.y, p.x);
            float radius = pow(r, strength);
            vec2 uv;
            uv.x = radius * cos(theta);
            uv.y = radius * sin(theta);
            uv = (uv + 1.0) * 0.5;
            gl_FragColor = texture2D(map, uv);
          } else {
            gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
          }
        }
      `,
      side: THREE.BackSide
    });

    const geometry = new THREE.SphereGeometry(10, 64, 64);
    const sphere = new THREE.Mesh(geometry, fisheyeShaderMaterial);
    scene.add(sphere);

    renderer.setAnimationLoop(render);
    window.addEventListener('resize', onWindowResize);
  }

  function render() {
    renderer.render(scene, camera);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
</script>

</body>
</html>
