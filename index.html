<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>YouTube VR Style Panoramic Camera Viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 10;
      background: rgba(0, 0, 0, 0.85);
      padding: 12px;
      border-radius: 8px;
      max-width: 300px;
      display: block;
    }
    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
      width: 100%;
    }
    .control-group {
      margin-top: 8px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
    }
    input[type="range"] {
      width: 100%;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

<div id="ui">
  <button id="start-btn">カメラ起動</button>
  <p id="status">ボタンを押してカメラを許可してください。端末を横向きにしてご使用ください。</p>
  
  <div class="control-group">
    <label for="ipd-range">目の間隔調整 (IPD): <span id="ipd-val">0.064</span></label>
    <input type="range" id="ipd-range" min="0.03" max="0.10" step="0.002" value="0.064">
  </div>
</div>

<video id="webcam" autoplay playsinline style="display:none;"></video>

<script type="module">
  import * as THREE from 'three';

  let scene, cameraLeft, cameraRight, renderer, video, videoTexture;
  let eyeSep = 0.064; 

  const startBtn = document.getElementById('start-btn');
  const ui = document.getElementById('ui');
  const status = document.getElementById('status');
  const ipdRange = document.getElementById('ipd-range');
  const ipdVal = document.getElementById('ipd-val');
  video = document.getElementById('webcam');

  ipdRange.addEventListener('input', (e) => {
    eyeSep = parseFloat(e.target.value);
    ipdVal.textContent = eyeSep.toFixed(3);
    updateCameraPositions();
  });

  startBtn.addEventListener('click', async () => {
    requestFullScreenMode();
    ui.style.display = 'none';

    try {
      const constraints = {
        video: {
          facingMode: { ideal: "environment" },
          zoom: { ideal: 0 }
        },
        audio: false
      };

      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      await video.play();

      const track = stream.getVideoTracks()[0];
      if (track && track.getCapabilities) {
        const capabilities = track.getCapabilities();
        if (capabilities.zoom) {
          try {
            await track.applyConstraints({ advanced: [{ zoom: capabilities.zoom.min }] });
          } catch (e) {}
        }
      }

      initThreeJS();
    } catch (err) {
      ui.style.display = 'block';
      status.textContent = "起動に失敗しました: " + err.message;
    }
  });

  function requestFullScreenMode() {
    const docEl = document.documentElement;
    if (docEl.requestFullscreen) {
      docEl.requestFullscreen().catch(() => {});
    } else if (docEl.webkitRequestFullscreen) {
      docEl.webkitRequestFullscreen().catch(() => {});
    } else if (docEl.msRequestFullscreen) {
      docEl.msRequestFullscreen().catch(() => {});
    }
  }

  function initThreeJS() {
    scene = new THREE.Scene();

    // 視野角(FOV)を100に広げて視点を「引き」に設定
    const aspect = (window.innerWidth / 2) / window.innerHeight;
    cameraLeft = new THREE.PerspectiveCamera(100, aspect, 0.1, 1000);
    cameraRight = new THREE.PerspectiveCamera(100, aspect, 0.1, 1000);
    
    // 正面を向かせる
    cameraLeft.lookAt(0, 0, -1);
    cameraRight.lookAt(0, 0, -1);

    updateCameraPositions();

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.autoClear = false;
    document.body.appendChild(renderer.domElement);

    videoTexture = new THREE.VideoTexture(video);
    videoTexture.colorSpace = THREE.SRGBColorSpace;

    // YouTube VR規格（Equirectangular / パノラマドームマッピング ＋ 向き補正）
    const vrPanoramicMaterial = new THREE.ShaderMaterial({
      uniforms: {
        map: { value: videoTexture }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D map;
        varying vec2 vUv;

        void main() {
          // 90度回転のズレを解消し、正しく横画面へ適合させるUV変換
          vec2 correctedUv = vec2(vUv.x, 1.0 - vUv.y);

          // 自然な広角パノラマ表示（伸ばさずに描画）
          gl_FragColor = texture2D(map, correctedUv);
        }
      `,
      side: THREE.BackSide
    });

    // 180度ドーム状にカメラ映像を張り巡らせる（球体の内側）
    const geometry = new THREE.SphereGeometry(10, 64, 64, 0, Math.PI * 2, 0, Math.PI);
    const sphere = new THREE.Mesh(geometry, vrPanoramicMaterial);
    scene.add(sphere);

    animate();
    window.addEventListener('resize', onWindowResize);
  }

  function updateCameraPositions() {
    if (cameraLeft && cameraRight) {
      cameraLeft.position.set(-eyeSep / 2, 0, 0);
      cameraRight.position.set(eyeSep / 2, 0, 0);
    }
  }

  function animate() {
    requestAnimationFrame(animate);

    if (!scene) return;

    const width = window.innerWidth;
    const height = window.innerHeight;

    renderer.clear();

    const halfWidth = width / 2;

    // 左目（画面左半分全域）
    renderer.setViewport(0, 0, halfWidth, height);
    renderer.setScissor(0, 0, halfWidth, height);
    renderer.setScissorTest(true);
    renderer.render(scene, cameraLeft);

    // 右目（画面右半分全域）
    renderer.setViewport(halfWidth, 0, halfWidth, height);
    renderer.setScissor(halfWidth, 0, halfWidth, height);
    renderer.setScissorTest(true);
    renderer.render(scene, cameraRight);
  }

  function onWindowResize() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const aspect = (width / 2) / height;

    if (cameraLeft && cameraRight) {
      cameraLeft.aspect = aspect;
      cameraLeft.updateProjectionMatrix();

      cameraRight.aspect = aspect;
      cameraRight.updateProjectionMatrix();
    }

    renderer.setSize(width, height);
  }
</script>

</body>
</html>
