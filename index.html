
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>VR Camera</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}
body{height:100dvh}
#app{position:fixed;inset:0;background:#000;overflow:hidden}
#view{width:100%;height:100%;display:block}
#controls{position:absolute;inset:0;overflow-y:auto;background:rgba(0,0,0,.84);padding:calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:15px}
h1{font-size:23px;margin:0}
p{font-size:13px;line-height:1.65;color:#ccc;margin:0}
.group{display:flex;flex-direction:column;gap:7px}
.label{display:flex;justify-content:space-between;gap:10px;font-size:14px}
input[type=range]{width:100%;accent-color:#60a5fa;height:28px}
button{border:0;border-radius:10px;padding:13px 15px;font-size:15px;font-weight:600;background:#fff;color:#111;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.5}
.row{display:flex;gap:9px}
.row button{flex:1;min-width:0}
.primary{background:#3b82f6;color:white}
.secondary{background:#333;color:white}
#status{font-size:13px;color:#facc15;line-height:1.5}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#hud button{pointer-events:auto;padding:10px 13px;font-size:13px;background:rgba(35,35,35,.8);color:#fff;border:1px solid #555}
#hud.hidden{display:none}
#controls.hidden{display:none}
#app:fullscreen{width:100%;height:100%;background:#000}
@media (orientation:portrait){
  #controls{gap:12px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="hud" class="hidden">
    <button id="panelBtn">設定</button>
    <button id="fullBtn">全画面</button>
  </div>
  <section id="controls">
    <h1>VR Camera</h1>
    <p>iPhone 17 ＋ Lufthansa VR Viewer<br>左右のレンズにカメラ映像を表示します。ゴーグルに装着してから調整してください。</p>
    <div class="row">
      <button id="startBtn" class="primary">カメラを起動</button>
      <button id="fullStartBtn" class="secondary">全画面</button>
    </div>
    <div id="status">カメラはまだ起動していません。</div>
    <div class="group">
      <div class="label"><span>映像の回転</span><span id="rotVal">90°</span></div>
      <input id="rotation" type="range" min="0" max="270" step="90" value="90">
    </div>
    <div class="group">
      <div class="label"><span>拡大率</span><span id="zoomVal">1.00×</span></div>
      <input id="zoom" type="range" min="0.7" max="2.5" step="0.01" value="1">
    </div>
    <div class="group">
      <div class="label"><span>左右位置</span><span id="xVal">0</span></div>
      <input id="shiftX" type="range" min="-100" max="100" step="1" value="0">
    </div>
    <div class="group">
      <div class="label"><span>上下位置</span><span id="yVal">0</span></div>
      <input id="shiftY" type="range" min="-100" max="100" step="1" value="0">
    </div>
    <div class="group">
      <div class="label"><span>左右の目の間隔（画面幅に対する割合）</span><span id="ipdVal">42.8%</span></div>
      <input id="ipd" type="range" min="35" max="50" step="0.1" value="42.8">
    </div>
    <div class="group">
      <div class="label"><span>レンズ位置の上下調整</span><span id="lensYVal">0</span></div>
      <input id="lensY" type="range" min="-100" max="100" step="1" value="0">
    </div>
    <div class="row">
      <button id="resetBtn" class="secondary">設定をリセット</button>
      <button id="hideBtn" class="primary">映像だけにする</button>
    </div>
    <p>全画面表示ができない場合は、Safariの共有メニューから「ホーム画面に追加」して起動してください。カメラの利用にはHTTPSとカメラへのアクセス許可が必要です。</p>
  </section>
</div>
<video id="camera" autoplay playsinline muted style="display:none"></video>
<script>
const canvas=document.getElementById("view");
const ctx=canvas.getContext("2d",{alpha:false});
const video=document.getElementById("camera");
const controls=document.getElementById("controls");
const hud=document.getElementById("hud");
const status=document.getElementById("status");
const $=id=>document.getElementById(id);
let stream=null;
let running=false;

const defaults={rotation:90,zoom:1,shiftX:0,shiftY:0,ipd:42.8,lensY:0};
const settings={...defaults};

function readSettings(){
  settings.rotation=Number($("rotation").value);
  settings.zoom=Number($("zoom").value);
  settings.shiftX=Number($("shiftX").value);
  settings.shiftY=Number($("shiftY").value);
  settings.ipd=Number($("ipd").value);
  settings.lensY=Number($("lensY").value);
  $("rotVal").textContent=settings.rotation+"°";
  $("zoomVal").textContent=settings.zoom.toFixed(2)+"×";
  $("xVal").textContent=settings.shiftX;
  $("yVal").textContent=settings.shiftY;
  $("ipdVal").textContent=settings.ipd.toFixed(1)+"%";
  $("lensYVal").textContent=settings.lensY;
  draw();
}

["rotation","zoom","shiftX","shiftY","ipd","lensY"].forEach(id=>{
  $(id).addEventListener("input",readSettings);
});

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.max(1,window.innerWidth);
  const h=Math.max(1,window.innerHeight);
  canvas.width=Math.round(w*dpr);
  canvas.height=Math.round(h*dpr);
  canvas.style.width=w+"px";
  canvas.style.height=h+"px";
  draw();
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>setTimeout(resize,250));

function drawEye(x,y,w,h){
  if(video.readyState<2||!video.videoWidth||!video.videoHeight){
    ctx.fillStyle="#000";
    ctx.fillRect(x,y,w,h);
    return;
  }
  ctx.save();
  ctx.beginPath();
  ctx.rect(x,y,w,h);
  ctx.clip();

  const vw=video.videoWidth;
  const vh=video.videoHeight;
  const angle=settings.rotation*Math.PI/180;
  const quarter=settings.rotation%180!==0;

  const rotatedW=quarter?vh:vw;
  const rotatedH=quarter?vw:vh;
  const scale=Math.max(w/rotatedW,h/rotatedH)*settings.zoom;
  const dw=vw*scale;
  const dh=vh*scale;

  const dx=x+w/2+settings.shiftX*w/100;
  const dy=y+h/2+(settings.shiftY+settings.lensY)*h/100;

  ctx.translate(dx,dy);
  ctx.rotate(angle);
  ctx.drawImage(video,-dw/2,-dh/2,dw,dh);
  ctx.restore();
}

function draw(){
  if(!canvas.width||!canvas.height)return;
  const w=canvas.width;
  const h=canvas.height;
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,w,h);

  // レンズ間隔の設定値に合わせて左右の映像の中心を配置
  const separation=w*settings.ipd/100;
  const leftCenter=w/2-separation/2;
  const rightCenter=w/2+separation/2;
  const eyeW=w/2;

  drawEye(leftCenter-eyeW/2,0,eyeW,h);
  drawEye(rightCenter-eyeW/2,0,eyeW,h);

  // 左右の境界線
  ctx.fillStyle="rgba(0,0,0,.45)";
  ctx.fillRect(w/2-1,0,2,h);
}

async function startCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    status.textContent="カメラを利用できません。HTTPSのGitHub Pagesで開いてください。";
    return;
  }
  $("startBtn").disabled=true;
  status.textContent="カメラを起動しています…";
  try{
    if(stream)stream.getTracks().forEach(track=>track.stop());
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1920},
        height:{ideal:1080}
      }
    });
    video.srcObject=stream;
    await video.play();
    running=true;
    status.textContent="カメラ起動中。ゴーグルに装着して位置を調整してください。";
    $("startBtn").textContent="カメラ起動中";
    resize();
  }catch(err){
    console.error(err);
    status.textContent="カメラを起動できませんでした: "+err.message+"。Safariのカメラ許可を確認してください。";
    $("startBtn").disabled=false;
  }
}

async function fullscreen(){
  try{
    if(document.fullscreenElement){
      await document.exitFullscreen();
      return;
    }
    if(document.documentElement.requestFullscreen){
      await document.documentElement.requestFullscreen();
      return;
    }
    if($("app").webkitRequestFullscreen){
      $("app").webkitRequestFullscreen();
      return;
    }
    status.textContent="このSafariではページ全体の全画面APIが使えません。ホーム画面に追加して起動すると、ブラウザのバーを隠せます。";
  }catch(err){
    status.textContent="全画面にできませんでした。ホーム画面に追加して起動してください。";
  }
}

function immersive(){
  controls.classList.add("hidden");
  hud.classList.remove("hidden");
  draw();
}

function showControls(){
  controls.classList.remove("hidden");
  hud.classList.add("hidden");
}

$("startBtn").addEventListener("click",startCamera);
$("fullStartBtn").addEventListener("click",fullscreen);
$("fullBtn").addEventListener("click",fullscreen);
$("hideBtn").addEventListener("click",immersive);
$("panelBtn").addEventListener("click",showControls);

$("resetBtn").addEventListener("click",()=>{
  Object.entries(defaults).forEach(([key,value])=>{
    const ids={rotation:"rotation",zoom:"zoom",shiftX:"shiftX",shiftY:"shiftY",ipd:"ipd",lensY:"lensY"};
    $(ids[key]).value=value;
  });
  readSettings();
});

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&running){
    resize();
  }
});

resize();
readSettings();
</script>
</body>
</html>
