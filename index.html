
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VR Camera Viewer</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#111;color:#eee;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
#viewer{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%;object-fit:contain}
#controls{flex:none;max-height:48%;overflow:auto;background:#202020;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));}
#controls.hidden{display:none}
h1{font-size:17px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
button,select{font:inherit;color:#fff;background:#383838;border:1px solid #666;border-radius:8px;padding:9px 11px}
button:active{background:#555}
button.primary{background:#1769aa;border-color:#398acb}
label.control{display:grid;grid-template-columns:100px 1fr 48px;gap:8px;align-items:center;width:100%;font-size:13px}
input[type=range]{width:100%;min-width:0;accent-color:#55aaff}
.value{text-align:right;font-variant-numeric:tabular-nums}
#status{font-size:12px;line-height:1.5;color:#bdbdbd;overflow-wrap:anywhere;margin-top:8px}
#status.error{color:#ff9b9b}
#hint{font-size:12px;color:#aaa;line-height:1.5}
#video{display:none}
body.immersive #app{height:100dvh}
@media (orientation:landscape){
  #controls{max-height:55%;padding:8px}
  h1{font-size:14px;margin-bottom:4px}
  .row{margin:5px 0}
  button,select{padding:6px 8px}
}
</style>
</head>
<body>
<div id="app">
  <div id="viewer">
    <canvas id="screen"></canvas>
  </div>

  <div id="controls">
    <h1>VR Camera Viewer</h1>

    <div class="row">
      <button id="start" class="primary">背面カメラを起動</button>
      <button id="ultra">0.5倍を試す</button>
      <button id="wide">1倍を試す</button>
      <button id="fullscreen">映像を大きく表示</button>
    </div>

    <div class="row">
      <label for="cameraSelect">カメラ</label>
      <select id="cameraSelect" style="flex:1;min-width:120px">
        <option value="">起動後に選択できます</option>
      </select>
      <button id="selectCamera">選択したカメラを起動</button>
    </div>

    <div class="row">
      <button id="rotate">回転：0°</button>
      <button id="reset">設定をリセット</button>
      <button id="hide">操作パネルを隠す</button>
    </div>

    <div class="row">
      <label class="control">
        <span>拡大率</span>
        <input id="zoom" type="range" min="1" max="3" step="0.05" value="1">
        <span class="value" id="zoomV">1.00</span>
      </label>
      <label class="control">
        <span>左右位置</span>
        <input id="shiftX" type="range" min="-100" max="100" step="1" value="0">
        <span class="value" id="shiftXV">0</span>
      </label>
      <label class="control">
        <span>上下位置</span>
        <input id="shiftY" type="range" min="-100" max="100" step="1" value="0">
        <span class="value" id="shiftYV">0</span>
      </label>
      <label class="control">
        <span>レンズ間隔</span>
        <input id="ipd" type="range" min="0" max="120" step="1" value="32">
        <span class="value" id="ipdV">32</span>
      </label>
      <label class="control">
        <span>上下の視点</span>
        <input id="lensY" type="range" min="-100" max="100" step="1" value="0">
        <span class="value" id="lensYV">0</span>
      </label>
    </div>

    <div id="hint">
      左右の映像は同じカメラ映像から作っています。スマホをゴーグルに入れる向きに合わせて回転を調整してください。<br>
      「0.5倍を試す」は、Safariから超広角カメラを選択できる場合に限り切り替わります。
    </div>
    <div id="status">まだカメラを起動していません。GitHub PagesなどHTTPSのページで開いてください。</div>
  </div>
</div>

<video id="video" autoplay playsinline muted></video>

<script>
(() => {
  const video = document.getElementById("video");
  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d", {alpha:false});
  const status = document.getElementById("status");
  const controls = document.getElementById("controls");
  const cameraSelect = document.getElementById("cameraSelect");

  let stream = null;
  let rotation = 0;
  let raf = 0;
  let cameras = [];
  let lastCameraLabel = "";

  const settings = {
    zoom: 1,
    shiftX: 0,
    shiftY: 0,
    ipd: 32,
    lensY: 0
  };

  function setStatus(message, error=false) {
    status.textContent = message;
    status.classList.toggle("error", error);
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
    video.srcObject = null;
  }

  function isFrontLabel(label) {
    return /front|user.?facing|true.?depth|前面|インカメラ/i.test(label || "");
  }

  function isUltraLabel(label) {
    return /ultra.?wide|ultrawide|超広角|0[.,]5\s*x|0[.,]5倍/i.test(label || "");
  }

  function isRearLabel(label) {
    return /back|rear|environment|背面|後面/i.test(label || "");
  }

  async function refreshCameras() {
    if (!navigator.mediaDevices?.enumerateDevices) return;

    const devices = await navigator.mediaDevices.enumerateDevices();
    cameras = devices.filter(d => d.kind === "videoinput");

    const oldValue = cameraSelect.value;
    cameraSelect.innerHTML = "";

    if (!cameras.length) {
      cameraSelect.add(new Option("カメラが見つかりません", ""));
      return;
    }

    cameras.forEach((device, index) => {
      const label = device.label || `カメラ ${index + 1}`;
      cameraSelect.add(new Option(label, device.deviceId));
    });

    if (cameras.some(d => d.deviceId === oldValue)) {
      cameraSelect.value = oldValue;
    } else if (stream) {
      const activeId = stream.getVideoTracks()[0]?.getSettings()?.deviceId;
      if (activeId && cameras.some(d => d.deviceId === activeId)) {
        cameraSelect.value = activeId;
      }
    }
  }

  async function startCamera(mode="rear", requestedDeviceId="") {
    if (!navigator.mediaDevices?.getUserMedia) {
      setStatus("カメラ機能が使えません。HTTPSのページをSafariで開いてください。", true);
      return;
    }

    setStatus("カメラを起動しています…");
    stopCamera();

    let newStream = null;
    let lastError = null;

    const baseVideo = {
      width: {ideal:1920},
      height: {ideal:1080}
    };

    // 個別のカメラを指定した場合は、まずそのカメラを試す
    if (requestedDeviceId) {
      try {
        newStream = await navigator.mediaDevices.getUserMedia({
          audio:false,
          video:{
            ...baseVideo,
            deviceId:{exact:requestedDeviceId}
          }
        });
      } catch (e) {
        lastError = e;
      }
    }

    // iPhoneの背面カメラを指定して起動
    if (!newStream && mode !== "device") {
      const constraints = [
        {audio:false,video:{...baseVideo,facingMode:{exact:"environment"}}},
        {audio:false,video:{...baseVideo,facingMode:{ideal:"environment"}}}
      ];

      for (const constraint of constraints) {
        try {
          newStream = await navigator.mediaDevices.getUserMedia(constraint);
          break;
        } catch (e) {
          lastError = e;
        }
      }
    }

    if (!newStream) {
      const message = lastError?.name === "NotAllowedError"
        ? "カメラの使用が許可されていません。Safariのサイト設定でカメラを許可してください。"
        : lastError?.name === "NotFoundError"
        ? "利用できるカメラが見つかりませんでした。"
        : `カメラを起動できませんでした（${lastError?.name || "エラー"}）。${lastError?.message || ""}`;
      setStatus(message, true);
      return;
    }

    const track = newStream.getVideoTracks()[0];
    const actualSettings = track.getSettings();

    // 前面カメラと判定できる場合は、誤って使用しない
    if (!requestedDeviceId && actualSettings.facingMode === "user") {
      newStream.getTracks().forEach(t => t.stop());
      setStatus("前面カメラが選ばれました。背面カメラを選択できませんでした。Safariのカメラ許可設定を確認してください。", true);
      return;
    }

    stream = newStream;
    video.srcObject = stream;

    try {
      await video.play();
    } catch (e) {
      setStatus("カメラは取得できましたが映像を再生できません。画面をタップして再試行してください。", true);
      return;
    }

    lastCameraLabel = track.label || "カメラ";
    await refreshCameras();

    const modeText = isUltraLabel(lastCameraLabel)
      ? "超広角カメラが選択されています"
      : mode === "ultra"
      ? "超広角レンズを特定できません。選択中のカメラを起動しました。0.5倍になったかは未確認です"
      : "カメラ起動成功";

    setStatus(`${modeText}：${lastCameraLabel}`);
    draw();
  }

  async function tryUltra() {
    // まず、Safariが個別に公開している超広角カメラを探す
    try {
      await refreshCameras();
      const ultra = cameras.find(d => isUltraLabel(d.label) && !isFrontLabel(d.label));

      if (ultra) {
        await startCamera("ultra", ultra.deviceId);
        return;
      }

      // 超広角カメラが別デバイスとして公開されていない場合、
      // 背面カメラを再起動する。0.5倍に切り替わったとは表示しない。
      await startCamera("ultra");
      if (stream && !isUltraLabel(lastCameraLabel)) {
        setStatus(
          "Safariから0.5倍レンズを個別に選択できませんでした。背面カメラは起動していますが、0.5倍になったとは確認できません。",
          false
        );
      }
    } catch (e) {
      setStatus(`0.5倍カメラを選択できませんでした：${e.message || e}`, true);
    }
  }

  function draw() {
    raf = requestAnimationFrame(draw);

    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (!w || !h) return;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const pixelW = Math.round(w * dpr);
    const pixelH = Math.round(h * dpr);

    if (canvas.width !== pixelW || canvas.height !== pixelH) {
      canvas.width = pixelW;
      canvas.height = pixelH;
    }

    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    if (!video.videoWidth || !video.videoHeight) return;

    const halfW = canvas.width / 2;
    const halfH = canvas.height;
    const sourceW = video.videoWidth;
    const sourceH = video.videoHeight;
    const angle = rotation * Math.PI / 180;

    // 回転後の映像の縦横比を使い、各画面に収まるように描画
    const rotatedW = Math.abs(sourceW * Math.cos(angle)) + Math.abs(sourceH * Math.sin(angle));
    const rotatedH = Math.abs(sourceW * Math.sin(angle)) + Math.abs(sourceH * Math.cos(angle));
    const scale = Math.max(halfW / rotatedW, halfH / rotatedH) * settings.zoom;

    function drawEye(centerX, eyeOffset) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(centerX - halfW/2, 0, halfW, halfH);
      ctx.clip();

      ctx.translate(centerX, halfH/2);
      ctx.translate(settings.shiftX * dpr, settings.shiftY * dpr);
      ctx.translate(eyeOffset * dpr, settings.lensY * dpr);
      ctx.rotate(angle);
      ctx.scale(scale, scale);
      ctx.drawImage(video, -sourceW/2, -sourceH/2, sourceW, sourceH);
      ctx.restore();
    }

    drawEye(halfW/2, -settings.ipd/2);
    drawEye(halfW + halfW/2, settings.ipd/2);

    ctx.strokeStyle = "#333";
    ctx.lineWidth = Math.max(1, dpr);
    ctx.beginPath();
    ctx.moveTo(halfW,0);
    ctx.lineTo(halfW,canvas.height);
    ctx.stroke();
  }

  function updateSettings() {
    for (const key of Object.keys(settings)) {
      const input = document.getElementById(key);
      const output = document.getElementById(key + "V");
      settings[key] = Number(input.value);
      if (output) {
        output.textContent = key === "zoom"
          ? settings[key].toFixed(2)
          : String(settings[key]);
      }
    }
  }

  ["zoom","shiftX","shiftY","ipd","lensY"].forEach(id => {
    document.getElementById(id).addEventListener("input", updateSettings);
  });

  document.getElementById("start").addEventListener("click", () => startCamera("rear"));
  document.getElementById("ultra").addEventListener("click", tryUltra);
  document.getElementById("wide").addEventListener("click", () => startCamera("rear"));
  document.getElementById("selectCamera").addEventListener("click", async () => {
    if (!cameraSelect.value) {
      setStatus("カメラを選択してください。", true);
      return;
    }
    await startCamera("device", cameraSelect.value);
  });

  document.getElementById("rotate").addEventListener("click", event => {
    rotation = (rotation + 90) % 360;
    event.currentTarget.textContent = `回転：${rotation}°`;
  });

  document.getElementById("reset").addEventListener("click", () => {
    rotation = 0;
    document.getElementById("rotate").textContent = "回転：0°";
    document.getElementById("zoom").value = 1;
    document.getElementById("shiftX").value = 0;
    document.getElementById("shiftY").value = 0;
    document.getElementById("ipd").value = 32;
    document.getElementById("lensY").value = 0;
    updateSettings();
  });

  document.getElementById("hide").addEventListener("click", () => {
    controls.classList.add("hidden");
    document.body.classList.add("immersive");
  });

  document.getElementById("fullscreen").addEventListener("click", async () => {
    if (controls.classList.contains("hidden")) {
      controls.classList.remove("hidden");
      document.body.classList.remove("immersive");
      return;
    }

    try {
      if (document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen();
      } else {
        controls.classList.add("hidden");
        document.body.classList.add("immersive");
        setStatus("操作パネルを隠しました。画面をタップすると操作パネルを再表示できます。");
      }
    } catch (e) {
      controls.classList.add("hidden");
      document.body.classList.add("immersive");
      setStatus("Safariでは通常の全画面表示が使えないため、操作パネルを隠しました。画面をタップすると操作パネルを再表示できます。");
    }
  });

  // 操作パネルを隠した後、画面をタップすると戻す
  canvas.addEventListener("click", () => {
    if (controls.classList.contains("hidden")) {
      controls.classList.remove("hidden");
      document.body.classList.remove("immersive");
    }
  });

  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) {
      controls.classList.remove("hidden");
      document.body.classList.remove("immersive");
    }
  });

  window.addEventListener("resize", () => {
    // draw()がキャンバスのサイズを更新する
  });

  updateSettings();
  draw();
})();
</script>
</body>
</html>
